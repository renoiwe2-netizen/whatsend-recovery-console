<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Console de démonstration</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef7f2;color:#123c32;font:16px/1.45 system-ui,sans-serif}main{max-width:740px;margin:auto;padding:12px}

</main></body></html>
