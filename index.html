<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connexion sécurisée</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#eef7f2;color:#123c32;font:16px/1.45 system-ui,sans-serif}main{max-width:740px;height:var(--screen-height,100dvh);margin:auto;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:white;flex:none}header>div{min-width:0}h1{font-size:17px;line-height:1.3;margin:0}p{margin:0}button{font:600 14px/1.3 system-ui,sans-serif;min-height:44px;border:0;border-radius:9px;padding:10px 14px;background:#075e54;color:white;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #e5a500;outline-offset:2px}button:disabled{opacity:.55;cursor:default}[hidden]{display:none!important}
#status{font-size:12px;line-height:1.4;margin-top:3px;overflow-wrap:anywhere}#close{flex:none}#tools{display:flex;gap:8px;flex:none;padding:6px 12px;background:white;border-bottom:1px solid #b7d5c9}#tools button{flex:1;background:#e5f2eb;color:#075e54;border:1px solid #b7d5c9}#tools button[aria-pressed=true]{background:#075e54;color:white}iframe{display:block;flex:1 1 0;min-width:0;min-height:0;width:100%;border:0;background:#182a24}footer{flex:none;padding:6px 12px;padding-bottom:max(6px,env(safe-area-inset-bottom));font-size:12px;line-height:1.35;background:white;border-top:1px solid #b7d5c9}#metrics{font-variant-numeric:tabular-nums;color:#496756}
</style><script src="/client.js" defer></script></head><body><main>
<header><div><h1 id="heading">Connexion du robot</h1><p id="status" role="status">Vérification de l’accès…</p></div><button id="close" hidden>Fermer</button></header>
<div id="tools" role="group" aria-label="Contrôles du navigateur distant" hidden><button id="keyboard" type="button" aria-pressed="false">Clavier</button><button id="pan" type="button" aria-pressed="false">Déplacer</button></div>
<p id="verification" role="status" style="padding:6px 12px;background:white;font-size:14px" hidden></p>
<button id="refresh" type="button" style="margin:4px 12px" hidden>Recharger la vérification</button>
<iframe id="desktop" title="Navigateur de connexion sécurisée" hidden allow="fullscreen"></iframe>
<footer><p id="hint">Aucun envoi de campagne depuis cette fenêtre.</p><p id="metrics">Le navigateur attend une ouverture autorisée.</p></footer>
</main></body></html>
