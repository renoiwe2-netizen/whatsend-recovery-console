<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reconnexion fictive — test local uniquement</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf7f2;color:#123d31;font:16px/1.45 system-ui,sans-serif;padding:22px 18px}main{max-width:460px;margin:auto}small{font-size:13px;color:#516b60}h1{font-size:25px;line-height:1.2;margin:18px 0}p{margin:12px 0}.card{background:#fff;padding:20px;border:1px solid #cddfd5;border-radius:18px}label{display:block;margin:18px 0 8px;font-weight:600}input[type=text]{width:100%;padding:12px;border:1px solid #91afa0;border-radius:9px;font:inherit}input[type=checkbox]{width:23px;height:23px;vertical-align:middle;margin:0 9px 0 0}button{display:block;width:100%;min-height:48px;background:#087d57;color:white;border:0;border-radius:10px;font:600 16px system-ui;margin:22px 0 0;padding:12px}button:focus-visible,input:focus-visible{outline:3px solid #f4b642;outline-offset:3px}#result{padding:14px;border-radius:10px;background:#e5f5ec;min-height:50px}strong{display:block;margin:0 0 4px}
</style>
<main><small>WHATSEND · PROTOTYPE LOCAL</small><h1>Une vérification à portée de main.</h1><div class="card"><strong>Cette page est une simulation.</strong><p>Teste le toucher, le clavier et la lisibilité. Aucun compte n'est connecté.</p><label for="name">Texte de démonstration</label><input id="name" type="text" placeholder="Écris « test »" autocomplete="off"><label><input id="check" type="checkbox">Je valide la démonstration</label><button id="confirm">Confirmer le test</button><p id="result" role="status">En attente de ton geste.</p></div><p><small>Aucun mot de passe à saisir. Aucun vrai CAPTCHA, message ou paiement.</small></p></main>
<script>document.getElementById('confirm').addEventListener('click',()=>{document.getElementById('result').textContent=document.getElementById('check').checked?'Connexion fictive validée. Le test tactile fonctionne.':'Coche la case pour terminer le test.';});</script></html>
